# Demo broker: anonymous, local only. Persistence lets Node-RED's QoS 1 session survive a restart.
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
sys_interval 5
# The compose healthcheck connects every few seconds; do not log each connect/disconnect.
log_type error
log_type warning
log_type notice
